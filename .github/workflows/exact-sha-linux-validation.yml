name: Exact SHA Linux validation

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.sha }}

      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          echo "Kernel:"
          uname -a
          echo "HEAD:"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --locked --python 3.11 \
            --extra all \
            --extra dev \
            --extra anthropic \
            --extra mistral \
            --extra fal \
            --extra modal \
            --extra daytona \
            --extra hindsight \
            --extra parallel-web

      - name: Run canonical Linux acceptance tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh --files tests/hermes_cli/test_kanban_pr_acceptance.py
        env:
          HERMES_TEST_WORKERS: 1
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
